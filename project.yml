name: DMRMonitor
options:
  bundleIdPrefix: com.carrierwave
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
packages:
  AMBE:
    path: Packages/AMBE
targets:
  DMRMonitor:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - DMRMonitor.entitlements
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: AMBE
    # development = APNs sandbox, matching the dev-signed builds xc deploy
    # produces; the server must run with production = false
    entitlements:
      path: App/DMRMonitor.entitlements
      properties:
        aps-environment: development
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Voice transmit to your selected DMR talkgroup.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Outfit-Regular.ttf
          - Outfit-Medium.ttf
          - Outfit-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7UE4RDLUSX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: "0.3.0"
  DMRMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DMRMonitor
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7UE4RDLUSX
