name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftformat swiftlint

      - name: Format
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint --strict

      - name: Generate project
        run: xcodegen

      - name: Build
        run: |
          xcodebuild -project DMRMonitor.xcodeproj -scheme DMRMonitor \
            -destination 'generic/platform=iOS' -quiet build \
            CODE_SIGNING_ALLOWED=NO
